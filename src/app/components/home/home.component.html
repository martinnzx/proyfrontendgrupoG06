<div class="min-vh-100 bg-light d-flex align-items-center">
  <div class="container py-5">
    <div class="row align-items-center">
      
      <div class="col-lg-6 text-center text-lg-start">
        <h1 class="display-3 fw-bold text-dark mb-4">
          Potenciá tu <span class="text-primary">Gimnasio</span> al máximo
        </h1>
        <p class="lead text-secondary mb-4">
          GymHub es la plataforma definitiva para gestionar tus socios, rutinas y pagos. Todo en un solo lugar, de forma rápida y segura.
        </p>
        <div class="d-grid gap-2 d-md-flex justify-content-md-start">
          <button class="btn btn-primary btn-lg px-4 me-md-2 fw-bold" [routerLink]="['/login']">
            Iniciar Sesión
          </button>
          
          <button class="btn btn-outline-secondary btn-lg px-4 fw-bold" [routerLink]="['/register']">
            Registrarse
          </button>
        </div>
      </div>

      <div class="col-lg-6 mt-5 mt-lg-0 text-center">
        <div style="font-size: 10rem;">
          🏋️‍♂️💪
        </div>
      </div>

    </div>
  </div>
</div>

<!-- Sección de Ubicacion con Google Maps API -->
<div class="bg-white py-5">
  <div class="container text-center">
    <h2 class="fw-bold text-dark mb-4">📍 Nuestra Ubicación</h2>
    <p class="text-secondary mb-4">Encontrá tu sucursal más cercana y vení a entrenar con nosotros.</p>
    
    <div class="card shadow border-0 overflow-hidden" style="border-radius: 15px;">
      <!-- Google Maps Embed API -->
      <iframe 
        src="https://maps.google.com/maps?q=Quantum+Gym%2C+Jujuy%2C+Argentina&t=&z=15&ie=UTF8&iwloc=&output=embed" 
        width="100%" 
        height="400" 
        style="border:0;" 
        allowfullscreen="" 
        loading="lazy" 
        referrerpolicy="no-referrer-when-downgrade">
      </iframe>
    </div>
  </div>
</div>
