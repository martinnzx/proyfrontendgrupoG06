<button class="btn btn-primary" (click)="cargarUsuarios()">Cargar Usuarios</button>

<table class="table mt-3">
  <thead>
    <tr>
      <th>Nombre</th>
      <th>Apellido</th>
      <th>DNI</th>
      <th>Email</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let u of usuarios">
      <td>{{u.nombre}}</td>
      <td>{{u.apellido}}</td>
      <td>{{u.dni}}</td>
      <td>{{u.email}}</td>
    </tr>
  </tbody>
</table>
