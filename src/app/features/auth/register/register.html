<!-- ══ Vista de Registro (formulario original + botón de Google) ══ -->
<div *ngIf="!googleUser" class="d-flex align-items-center justify-content-center min-vh-100 bg-light">
  <div class="card shadow-sm" style="width: 100%; max-width: 400px">
    <div class="card-body p-4">
      <h1 class="h4 mb-4 text-center">Crear cuenta</h1>

      <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
        <div class="mb-3">
          <label for="nombre" class="form-label">Nombre</label>
          <input
            id="nombre"
            type="text"
            class="form-control"
            formControlName="nombre"
            [class.is-invalid]="form.controls.nombre.invalid && form.controls.nombre.touched"
          />
          <div class="invalid-feedback">Ingresá tu nombre.</div>
        </div>

        <div class="mb-3">
          <label for="apellido" class="form-label">Apellido</label>
          <input
            id="apellido"
            type="text"
            class="form-control"
            formControlName="apellido"
            [class.is-invalid]="form.controls.apellido.invalid && form.controls.apellido.touched"
          />
          <div class="invalid-feedback">Ingresá tu apellido.</div>
        </div>

        <div class="mb-3">
          <label for="email" class="form-label">Correo electrónico</label>
          <input
            id="email"
            type="email"
            class="form-control"
            formControlName="email"
            [class.is-invalid]="form.controls.email.invalid && form.controls.email.touched"
          />
          <div class="invalid-feedback">Ingresá un correo válido.</div>
        </div>

        <div class="mb-3">
          <label for="password" class="form-label">Contraseña</label>
          <input
            id="password"
            type="password"
            class="form-control"
            formControlName="password"
            [class.is-invalid]="form.controls.password.invalid && form.controls.password.touched"
          />
          <div class="invalid-feedback">La contraseña debe tener al menos 6 caracteres.</div>
        </div>

        <div class="mb-3">
          <label for="confirmPassword" class="form-label">Confirmar contraseña</label>
          <input
            id="confirmPassword"
            type="password"
            class="form-control"
            formControlName="confirmPassword"
            [class.is-invalid]="
              form.controls.confirmPassword.touched &&
              (form.controls.confirmPassword.invalid || form.errors?.['passwordsMismatch'])
            "
          />
          <div class="invalid-feedback">Las contraseñas no coinciden.</div>
        </div>

        <button type="submit" class="btn btn-primary w-100" [disabled]="loading">
          {{ loading ? 'Creando cuenta...' : 'Registrarme' }}
        </button>
      </form>

      <!-- ── Separador y botón de Google (agregado) ── -->
      <hr class="my-3" />
      <p class="text-muted text-center small mb-3">O registrate con Google</p>
      <div class="d-flex justify-content-center mb-3">
        <div id="googleBtnRegister"></div>
      </div>

      <p class="text-center mt-3 mb-0">¿Ya tenés cuenta? <a routerLink="/login">Iniciá sesión</a></p>
    </div>
  </div>
</div>

<!-- ══ Vista de Perfil (cuando el usuario se registró con Google) ══ -->
<div *ngIf="googleUser" class="d-flex align-items-center justify-content-center min-vh-100 bg-light">
  <div class="card shadow-sm" style="width: 100%; max-width: 400px">
    <div class="card-body p-4 text-center">
      <h2 class="h5 mb-4">¡Registro exitoso!</h2>

      <img
        [src]="googleUser.picture"
        [alt]="googleUser.name"
        class="rounded-circle mb-3 border"
        width="96"
        height="96"
      />

      <h3 class="h5 mb-1">{{ googleUser.name }}</h3>
      <p class="text-muted mb-3">{{ googleUser.email }}</p>
      <span class="badge bg-success mb-4 d-inline-block">Miembro</span>

      <div class="mt-3">
        <button class="btn btn-danger w-100" (click)="signOut()">
          Cerrar Sesión
        </button>
      </div>
    </div>
  </div>
</div>
